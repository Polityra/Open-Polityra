name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node.js workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint --if-present
      - name: Typecheck
        run: pnpm run typecheck --if-present
      - name: Test
        run: pnpm run test --if-present
      - name: Build
        run: pnpm run build --if-present

  python:
    name: Python analysis worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry==1.8.5
      - name: Install worker dependencies
        run: poetry install --with dev
      - name: Lint
        run: poetry run ruff check src tests
      - name: Typecheck
        run: poetry run mypy src
      - name: Test
        run: poetry run pytest

  fiscal-data:
    name: Fiscal data validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate checked-in Eurostat snapshot
        run: python scripts/data/import_fiscal_data.py
      - name: Test fiscal data importer
        run: python -m unittest scripts.data.test_import_fiscal_data
