name: Feature request
description: Propose a feature or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What user or research need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Risks, evidence, and limitations
      description: Include provenance, privacy, neutrality, uncertainty, and human oversight where relevant.
    validations:
      required: false
