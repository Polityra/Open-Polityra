packages:
  - "apps/*"
  - "packages/*"
  - "packages/config/*"

# Python services under services/ are managed independently with pyproject.toml.
# Add a directory here only when it contains a Node.js package with its own package.json.
overrides:
  "@typescript-eslint/typescript-estree>minimatch": 11.0.4

allowBuilds:
  bcrypt: false
  esbuild: false
